# NeoCharge dedicated anonymous MQTT broker — device-facing, bridged to core-mosquitto
# =====================================================================================
# Purpose: the NeoCharge Smart Splitter (10.0.8.60, UUID P12-XXX) connects ANONYMOUSLY
#   (21-byte CONNECT, client-id "P12-XXX", NO username/password — confirmed off the wire
#   2026-06-13). HA's core-mosquitto uses the go-auth plugin and can't safely accept an
#   anonymous client without opening the primary broker network-wide. So this throwaway
#   broker accepts the device anonymously and BRIDGES only its two topics into
#   core-mosquitto, where HA reads/writes them via its normal MQTT integration.
#
# Runs on the HA VM (VLAN8 10.0.8.10), host network, listener 1893.
# gatekeeper DNATs the device's cloud session (52.53.137.231:1883) -> 10.0.8.10:1893 + hairpin SNAT.
#
# Deploy:
#   ssh jp@10.0.0.10 "sudo mkdir -p /share/neocharge-mqtt"
#   cat tools/neocharge-mqtt.conf | ssh jp@10.0.0.10 "sudo tee /share/neocharge-mqtt/mosquitto.conf >/dev/null"
#   ssh jp@10.0.0.10 "sudo docker run -d --name neocharge-mqtt --restart unless-stopped \
#     --network host -v /mnt/data/supervisor/share/neocharge-mqtt:/mosquitto/config eclipse-mosquitto:2"

# --- device-facing listener (anonymous) ---
listener 1893 0.0.0.0
allow_anonymous true
persistence false
connection_messages true
log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp_format %Y-%m-%d %H:%M:%S

# --- bridge to HA's core-mosquitto (HA reads/writes here) ---
connection neocharge-bridge
address 127.0.0.1:1883
remote_username jp
remote_password REDACTED_EXAMPLE_PSK
remote_clientid neocharge-bridge
bridge_protocol_version mqttv311
cleansession true
notifications false
start_type automatic
restart_timeout 5 30
# device status (device->local) forwarded UP to core-mosquitto so HA sensors see it
topic log out 0
# device also publishes FULL status on `error` (QoS1) autonomously on reconnect — forward it too
topic error out 0
# HA commands / PING heartbeat (core-mosquitto->local) forwarded DOWN so the device sees them
topic P12-XXX in 0
